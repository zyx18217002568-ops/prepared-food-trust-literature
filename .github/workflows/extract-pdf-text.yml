# Automatically mirror repository PDFs into UTF-8 text for literature reading.
name: Extract PDF full text

on:
  push:
    paths:
      - '**/*.pdf'
      - 'tools/extract_pdf_text.py'
      - '.github/workflows/extract-pdf-text.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Extract all PDF text
        run: |
          python3 tools/extract_pdf_text.py --repo . --clean

      - name: Show extraction summary
        run: |
          echo '--- extraction status ---'
          cat '_全文文本/提取状态.md'

      - name: Commit generated full-text files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '_全文文本'
          if git diff --cached --quiet; then
            echo 'No extracted-text changes to commit.'
          else
            git commit -m 'Auto-extract PDF full text'
            git push
          fi
